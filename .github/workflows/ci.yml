name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  ALGOKIT_VERSION: 'v2.6.0'

jobs:
  # Job 1: Install dependencies and compile contract
  build:
    name: Build Smart Contract
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: smart_contracts/projects/smart_contracts/package-lock.json

      - name: Install AlgoKit
        run: |
          # Install AlgoKit CLI
          curl -sL https://github.com/algorandfoundation/algokit-cli/releases/download/$ALGOKIT_VERSION/algokit-$ALGOKIT_VERSION-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv algokit /usr/local/bin/algokit
          algokit --version

      - name: Install Puya compiler
        run: |
          npm install -g @algorandfoundation/puya-ts

      - name: Install smart contract dependencies
        working-directory: smart_contracts/projects/smart_contracts
        run: npm ci

      - name: Cache AlgoKit LocalNet
        uses: actions/cache@v4
        with:
          path: ~/.algokit
          key: ${{ runner.os }}-algokit-localnet-${{ hashFiles('smart_contracts/projects/smart_contracts/**') }}
          restore-keys: |
            ${{ runner.os }}-algokit-localnet-

      - name: Build TypeScript contract
        working-directory: smart_contracts/projects/smart_contracts
        run: npm run build

      - name: Generate client
        working-directory: smart_contracts/projects/smart_contracts
        run: algokit generate client smart_contracts/artifacts/growpod --output smart_contracts/artifacts/growpod/GrowPodEmpireClient.ts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: smart_contracts/projects/smart_contracts/smart_contracts/artifacts/
          retention-days: 1

  # Job 2: Run unit tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: smart_contracts/projects/smart_contracts/package-lock.json

      - name: Install AlgoKit
        run: |
          curl -sL https://github.com/algorandfoundation/algokit-cli/releases/download/$ALGOKIT_VERSION/algokit-$ALGOKIT_VERSION-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv algokit /usr/local/bin/algokit

      - name: Install Puya compiler
        run: |
          npm install -g @algorandfoundation/puya-ts

      - name: Install smart contract dependencies
        working-directory: smart_contracts/projects/smart_contracts
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts
          path: smart_contracts/projects/smart_contracts/smart_contracts/artifacts/

      - name: Start AlgoKit LocalNet
        working-directory: smart_contracts/projects/smart_contracts
        run: |
          algokit localnet start
          sleep 10

      - name: Run unit tests
        working-directory: smart_contracts/projects/smart_contracts
        run: npm run test

      - name: Stop LocalNet
        if: always()
        working-directory: smart_contracts/projects/smart_contracts
        run: algokit localnet stop || true

  # Job 3: Lint check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: smart_contracts/projects/smart_contracts/package-lock.json

      - name: Install smart contract dependencies
        working-directory: smart_contracts/projects/smart_contracts
        run: npm ci

      - name: Run ESLint
        working-directory: smart_contracts/projects/smart_contracts
        run: npm run lint

      - name: Check TypeScript types
        working-directory: smart_contracts/projects/smart_contracts
        run: npm run check-types

      - name: Check formatting
        working-directory: smart_contracts/projects/smart_contracts
        run: npm run format -- --check

  # Job 4: TEAL Security Audit
  audit-teal:
    name: TEAL Security Audit
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: smart_contracts/projects/smart_contracts/package-lock.json

      - name: Install AlgoKit
        run: |
          curl -sL https://github.com/algorandfoundation/algokit-cli/releases/download/$ALGOKIT_VERSION/algokit-$ALGOKIT_VERSION-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv algokit /usr/local/bin/algokit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts
          path: smart_contracts/projects/smart_contracts/smart_contracts/artifacts/

      - name: Run TEAL security audit
        working-directory: smart_contracts/projects/smart_contracts
        run: npm run audit-teal
